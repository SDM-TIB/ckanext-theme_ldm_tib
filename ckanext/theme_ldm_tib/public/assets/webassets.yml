ldm-css:
  output: ckanext-theme_ldm_tib/%(version)s_ldm.css
  contents:
    - TIBtheme.css

new_user-js:
  output: ckanext-theme_ldm_tib/%(version)s_new_user.js
  extra:
    preload:
      - base/main
      - vendor/vendor
      - vendor/bootstrap
      - vendor/jquery
      - vendor/jquery.ui.core
  contents:
    - new_user_registration.js

cookies_alert-js:
  output: ckanext-theme_ldm_tib/%(version)s_cookies_alert.js
  extra:
    preload:
      - base/main
      - vendor/vendor
      - vendor/bootstrap
      - vendor/jquery
      - vendor/jquery.ui.core
  contents:
    - cookies_alert.js
