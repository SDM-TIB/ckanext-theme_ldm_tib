{%- set cookie_link -%}
<a href="{{ h.url_for('home') }}data_privacy#cookies">{{ _("cookie policy") }}</a>
{%- endset -%}
<div id="cookieAcceptBar" class="cookieAcceptBar">
    {% trans cookie_link=cookie_link %}Before browse our site, please accept our {{ cookie_link }}{% endtrans %}.<br>
    <button id="cookieAcceptBarConfirm" class="cookieAcceptBarButton btn btn-success">{{ _("Accept and close this alert") }}</button>
</div>
